# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "fc4-formats"
description = "FreeCity4 readers for SimCity 4 data formats: DBPF packages, QFS/RefPack, exemplars and cohorts, LTEXT, FSH textures, S3D models"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "fc4_formats"

[[bin]]
name = "fc4-dat"
path = "src/bin/fc4-dat.rs"

[dependencies]
# command_values: the converting getters for the command system's parameter values. Also used by
# tests/save_records.rs: the history and clock records of the saves, read and written by the cores.
fc4-core = { path = "../core" }
